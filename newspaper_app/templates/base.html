{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- Додаємо favicon -->
    <link rel="icon" href="{% static 'css/img/media_newspaper1.png' %}" type="image/x-icon">
    <title>{% block title %}Newspaper Agency{% endblock %}</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link href="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/css/bootstrap.min.css" rel="stylesheet">

    <style>
        /* Контейнер для видео на заднем фоне */
        .background-container {
            position: relative;
            width: 100%;
            min-height: 100vh; /* высота для покрытия экрана */
            overflow: hidden;
        }
        
        /* Видеофон */
        .background-container video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            z-index: -1; /* за контентом */
            opacity: 0.5; /* Прозрачность для видео */
        }
        
        /* Контейнер основного содержимого поверх видео */
        .content {
            position: relative;
            z-index: 1;
            color: white;
            padding: 20px;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="row">
            <!-- Sidebar -->
            <div class="col-sm-3">
                {% include 'includes/sidebar.html' %}
            </div>

            <!-- Основной контент с видеофоном -->
            <div class="col-sm-9">
                <div class="background-container">
                    <!-- Видео -->
                    <video autoplay muted loop>
                        <source src="{% static 'css/video/media_newspaper.mp4' %}" type="video/mp4">
                        Your browser does not support the video tag.
                    </video>
                    
                    <!-- Основной контент поверх видео -->
                    <div class="content">
                        {% block content %}
                        <!-- Основное содержимое страниц -->
                        <h1>Добро пожаловать в Newspaper Agency</h1>
                        <p>Здесь находится текст и основной контент.</p>
                        {% endblock %}
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Скрипты -->
    <script src="https://code.jquery.com/jquery-3.5.1.slim.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.5.2/dist/umd/popper.min.js"></script>
    <script src="https://stackpath.bootstrapcdn.com/bootstrap/4.5.2/js/bootstrap.min.js"></script>
    {% include 'includes/footer.html' %}
</body>
</html>
